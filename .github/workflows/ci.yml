name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        node: [22.19.0, 24.x]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build

  dsh-compatibility:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # Keep the per-PR matrix bounded: the oldest supported host, the last
        # 0.1 host, the 0.2 migration boundary, and the current host. The
        # historical matrix runs in dsh-compatibility-full.yml.
        dsh: [0.1.2-rc.1, 0.1.7-rc.2, 0.2.0-rc.2, 0.2.1-rc.5]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - run: npm ci
      - name: Run DSH compatibility suite in isolated CLI root
        run: node scripts/run-dsh-compatibility.mjs
        env:
          DSH_VERSION: ${{ matrix.dsh }}
