name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        node: [22.19.0, 24.x]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build

  dsh-compatibility:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        dsh: [0.1.2-rc.1, 0.1.5-rc.1]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - run: npm ci
      - name: Install complete DSH CLI dependency tree
        run: npm install --no-save --package-lock=false @deepseek-ai/dsh@${{ matrix.dsh }}
      - run: npm run check:dsh
      - run: npm run test:dsh
      - run: npm run build:dsh
      - run: npm run verify:dsh
        env:
          DSH_VERSION: ${{ matrix.dsh }}
