name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  actions: read
  pull-requests: read

# A newer commit supersedes an earlier run for the same PR. Keep main runs
# independent so a PR update cannot cancel validation of the release branch.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  reuse-pr-ci:
    runs-on: ubuntu-latest
    outputs:
      reuse: ${{ steps.match.outputs.reuse }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Check whether merged source already passed PR CI
        id: match
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/find-pr-ci.mjs

  classify:
    runs-on: ubuntu-latest
    outputs:
      run_windows: ${{ steps.risk.outputs.run_windows }}
      os_matrix: ${{ steps.risk.outputs.os_matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Classify changed paths
        id: risk
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/classify-ci-risk.mjs

  core:
    needs: [reuse-pr-ci, classify]
    if: needs.reuse-pr-ci.outputs.reuse != 'true'
    strategy:
      fail-fast: false
      matrix:
        node: [22.19.0, 24.x]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: node --test tests/find-release-ci.test.mjs tests/find-pr-ci.test.mjs tests/verify-package-supplied.test.mjs tests/classify-ci-risk.test.mjs tests/stage-candidate.test.mjs
      - run: npm run check
      - run: npm test
      - run: npm run build

  dsh-compatibility:
    needs: [reuse-pr-ci, classify]
    if: needs.reuse-pr-ci.outputs.reuse != 'true'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.classify.outputs.os_matrix) }}
        # Keep the per-PR matrix bounded: the oldest supported host, the last
        # 0.1 host, and the current host. The 0.2 migration boundary remains
        # in the historical matrix because its Windows tests are timing/lock
        # sensitive and should not block every PR.
        dsh: [0.1.2-rc.1, 0.1.7-rc.2, 0.2.2-rc.1]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - run: npm ci
      - name: Run DSH compatibility suite in isolated CLI root
        run: node scripts/run-dsh-compatibility.mjs
        env:
          DSH_VERSION: ${{ matrix.dsh }}
