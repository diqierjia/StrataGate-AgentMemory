name: DSH historical compatibility

on:
  schedule:
    # 02:30 Asia/Shanghai; keep the complete legacy matrix out of every PR.
    - cron: '30 18 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dsh-compatibility:
    # Cache save needs actions: write.
    permissions:
      contents: read
      actions: write
    # Same bound as the PR matrix: successful Windows cells reach about 47
    # minutes, and a hung install must not wait out the 6-hour default.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        dsh: [0.1.2-rc.1, 0.1.5-rc.1, 0.1.6-alpha.1, 0.1.7-rc.1, 0.1.7-rc.2, 0.2.0-rc.1, 0.2.0-rc.2, 0.2.1-rc.5, 0.2.2-rc.1]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        id: node
        with:
          node-version: 24.x
          cache: npm
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Install repository dependencies
        timeout-minutes: 20
        run: npm ci
      # Same isolate cache as the PR matrix. Keep this key identical to ci.yml.
      - name: Restore isolated DSH CLI
        id: isolate-cache
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/stratagate-dsh-isolate
          key: dsh-isolate-v1-${{ runner.os }}-${{ matrix.dsh }}-${{ steps.node.outputs.node-version }}-${{ hashFiles('scripts/dsh-cli-isolate.mjs') }}
      - name: Ensure isolated DSH CLI
        id: isolate-cli
        env:
          DSH_VERSION: ${{ matrix.dsh }}
          DSH_ISOLATE_ROOT: ${{ runner.temp }}/stratagate-dsh-isolate
        run: node scripts/dsh-cli-isolate.mjs
      - name: Save isolated DSH CLI
        if: steps.isolate-cli.outputs.cache_save == 'true' && steps.isolate-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/stratagate-dsh-isolate
          key: dsh-isolate-v1-${{ runner.os }}-${{ matrix.dsh }}-${{ steps.node.outputs.node-version }}-${{ hashFiles('scripts/dsh-cli-isolate.mjs') }}
      - name: Run full DSH compatibility suite in isolated CLI root
        run: node scripts/run-dsh-compatibility.mjs
        env:
          DSH_VERSION: ${{ matrix.dsh }}
          DSH_ISOLATE_ROOT: ${{ runner.temp }}/stratagate-dsh-isolate
